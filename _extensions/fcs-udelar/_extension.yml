title: FCS-Udelar Monografía de Grado
author: Joaquín Trinidad Mazzei (y Claude)
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    typst:
      knitr: false
      filters:
        - path: bibliography.lua
          at: pre-quarto
      template-partials:
        - typst-template.typ
        - typst-show.typ
        - biblio.typ
      csl: apa.csl
      fontsize: 12pt
      papersize: a4
      metadata:
        departamento: "xxx"
        licenciatura: "xxx"
        tutor: "xxx"
        lugar: "Montevideo"
